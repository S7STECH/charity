<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تصنيف الجمعيات</title>

<style>
body {
  font-family: 'Cairo', sans-serif;
  background: #0a1628;
  color: white;
  margin: 0;
}

.app-card {
  max-width: 500px;
  margin: 80px auto;
  background: #112240;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 10px;
  border: none;
  margin-top: 10px;
  font-size: 18px;
}

button {
  margin-top: 20px;
  padding: 15px;
  width: 100%;
  border: none;
  border-radius: 10px;
  background: #c9a84c;
  font-weight: bold;
  cursor: pointer;
}

/* 🔥 التصنيفات */
.tiers {
  margin-top: 25px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}

.tier {
  padding: 8px 12px;
  border-radius: 20px;
  background: rgba(255,255,255,0.05);
  font-size: 13px;
  border: 1px solid rgba(255,255,255,0.1);
  transition: 0.3s;
}

.tier.active {
  background: #c9a84c;
  color: #000;
  font-weight: bold;
}

#result {
  margin-top: 20px;
  font-size: 20px;
}

footer {
  text-align: center;
  margin-top: 40px;
  color: #aaa;
}
</style>
</head>

<body>

<div class="app-card">
  <h2>📊 تصنيف الجمعيات</h2>

  <input type="number" id="revenue" placeholder="أدخل الإيرادات السنوية">

  <button onclick="classify()">تصنيف</button>

  <div id="result"></div>

  <!-- 🔽 التصنيفات تظهر هنا -->
  <div class="tiers">
    <div class="tier" id="t1">🌱 متناهية الصغر</div>
    <div class="tier" id="t2">🏠 صغيرة</div>
    <div class="tier" id="t3">🏢 متوسطة</div>
    <div class="tier" id="t4">🏗️ كبيرة</div>
    <div class="tier" id="t5">🌆 متناهية الكبر</div>
  </div>

</div>

<footer>
  إعداد حسين بن سعيد
</footer>

<script>
function resetTiers(){
  document.querySelectorAll('.tier').forEach(t=>t.classList.remove('active'));
}

function classify() {
  let revenue = parseFloat(document.getElementById("revenue").value);

  if (isNaN(revenue) || revenue < 0) {
    document.getElementById("result").innerHTML = "⚠️ أدخل رقم صحيح";
    return;
  }

  let result = "";
  let activeId = "";

  if (revenue < 500000) {
    result = "🌱 متناهية الصغر";
    activeId = "t1";
  } else if (revenue <= 2000000) {
    result = "🏠 صغيرة";
    activeId = "t2";
  } else if (revenue <= 8000000) {
    result = "🏢 متوسطة";
    activeId = "t3";
  } else if (revenue <= 30000000) {
    result = "🏗️ كبيرة";
    activeId = "t4";
  } else {
    result = "🌆 متناهية الكبر";
    activeId = "t5";
  }

  document.getElementById("result").innerHTML = "📊 التصنيف: " + result;

  resetTiers();
  document.getElementById(activeId).classList.add("active");
}
</script>

</body>
</html>
