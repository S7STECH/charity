<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تصنيف الجمعيات</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Cairo', sans-serif;
  background: #0a1628;
  color: white;
  margin: 0;
}

/* تصميم بسيط ونظيف */
.app-card {
  max-width: 500px;
  margin: 80px auto;
  background: #112240;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 10px;
  border: none;
  margin-top: 10px;
  font-size: 18px;
}

button {
  margin-top: 20px;
  padding: 15px;
  width: 100%;
  border: none;
  border-radius: 10px;
  background: #c9a84c;
  font-weight: bold;
  cursor: pointer;
}

#result {
  margin-top: 20px;
  font-size: 20px;
}

footer {
  text-align: center;
  margin-top: 40px;
  color: #aaa;
}
</style>
</head>

<body>

<div class="app-card">
  <h2>📊 تصنيف الجمعيات</h2>

  <input type="number" id="revenue" placeholder="أدخل الإيرادات السنوية">

  <button onclick="classify()">تصنيف</button>

  <div id="result"></div>
</div>

<footer>
  إعداد الأستاذ / حسين بن سعيد
</footer>

<script>
function classify() {
  let revenue = parseFloat(document.getElementById("revenue").value);

  if (isNaN(revenue) || revenue < 0) {
    document.getElementById("result").innerHTML = "⚠️ أدخل رقم صحيح";
    return;
  }

  let result = "";

  if (revenue < 500000) {
    result = "متناهية الصغر";
  } else if (revenue <= 2000000) {
    result = "صغيرة";
  } else if (revenue <= 8000000) {
    result = "متوسطة";
  } else if (revenue <= 30000000) {
    result = "كبيرة";
  } else {
    result = "متناهية الكبر";
  }

  document.getElementById("result").innerHTML = "📊 التصنيف: " + result;
}
</script>

</body>
</html>
