<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصنيف الجمعيات حسب الإيرادات</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f7f6; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        input { width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        button { background-color: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1.1rem; }
        button:hover { background-color: #219150; }
        #result { margin-top: 20px; font-weight: bold; font-size: 1.2rem; color: #2c3e50; min-height: 1.5em; }
        .footer { margin-top: 30px; font-size: 0.9rem; color: #7f8c8d; border-top: 1px solid #eee; padding-top: 15px; }
        .link { margin-top: 10px; font-size: 0.8rem; }
        a { color: #3498db; text-decoration: none; }
    </style>
</head>
<body>

<div class="card">
    <h3>تصنيف الجمعيات السنوي</h3>
    <p>أدخل قيمة الإيرادات السنوية (ريال)</p>
    
    <input type="number" id="revenue" placeholder="مثال: 600000">
    <button onclick="classify()">تحليل التصنيف</button>

    <div id="result"></div>

    <div class="footer">
        اعداد الأستاذ / حسين بن سعيد
        <div class="link">
            <a href="#">رابط المنصة أو الموقع</a>
        </div>
    </div>
</div>

<script>
function classify() {
  let revenue = parseFloat(document.getElementById("revenue").value);

  // التحقق من صحة المدخل
  if (isNaN(revenue) || revenue < 0) {
    document.getElementById("result").innerHTML = "⚠️ أدخل رقم صحيح";
    return;
  }

  let result = "";

  // شروط التصنيف
  if (revenue < 500000) {
    result = "متناهية الصغر";
  } else if (revenue <= 2000000) {
    result = "صغيرة";
  } else if (revenue <= 8000000) {
    result = "متوسطة";
  } else if (revenue <= 30000000) {
    result = "كبيرة";
  } else {
    result = "متناهية الكبر";
  }

  // عرض النتيجة
  document.getElementById("result").innerHTML = "📊 التصنيف: " + result;
}
</script>

</body>
</html>
